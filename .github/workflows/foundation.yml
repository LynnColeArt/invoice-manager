          test "$(npm --version)" = "${NPM_VERSION}"
          test "$("${RUNNER_TEMP}/zig-x86_64-linux-${ZIG_VERSION}/zig" version)" = "${ZIG_VERSION}"
          test -f deps/shovelerdb/PROVENANCE
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Zig service
        run: npm run api:check

  migration_negative:
    name: foundation / migration-negative
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source and recursive submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
