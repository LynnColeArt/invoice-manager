name: Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - feat/p0-contract-spine

permissions:
  contents: read

env:
  NPM_VERSION: 11.16.0
  ZIG_VERSION: 0.16.0
  ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  contracts:
    name: foundation / contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source and recursive submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          check-latest: false
      - name: Install exact npm and Zig
        shell: bash
        run: |
          npm install --global "npm@${NPM_VERSION}"
          curl --fail --silent --show-error --location "${ZIG_URL}" --output "${RUNNER_TEMP}/zig.tar.xz"
          echo "${ZIG_SHA256}  ${RUNNER_TEMP}/zig.tar.xz" | sha256sum --check --strict
          tar --extract --file "${RUNNER_TEMP}/zig.tar.xz" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/zig-x86_64-linux-${ZIG_VERSION}" >> "${GITHUB_PATH}"
          test "$(npm --version)" = "${NPM_VERSION}"
          test "$("${RUNNER_TEMP}/zig-x86_64-linux-${ZIG_VERSION}/zig" version)" = "${ZIG_VERSION}"
          test -f deps/shovelerdb/PROVENANCE
      - name: Install locked dependencies
        run: npm ci
      - name: Validate contracts
        run: npm run contracts:check

  web:
    name: foundation / web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source and recursive submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
