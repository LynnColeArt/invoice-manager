failure_modes:
- Running only mocked unit tests for a changed persistence or renderer boundary.
- Meeting aggregate coverage while leaving a critical error branch untested.
- Silently skipping a red gate because the failure appears unrelated.
- Demanding unit-level TDD for a purely presentational adjustment with better 
  visual evidence.
id: how-we-apply-directive-030
name: Apply the Test and Typecheck Gate
purpose: Translate DIRECTIVE_030 into one risk-proportionate, reproducible 
  validation record for every behavior-changing invoice-manager change.
references:
- id: DIRECTIVE_030
  name: Governing quality directive
  type: directive
  when: Selecting and reporting pre-review validation.
- id: PROJECT_002
  name: Project risk directive
  type: directive
  when: Determining which checks are critical and fail-closed.
schema_version: '1.0'
steps:
- description: Identify affected Zig domain, persistence, HTTP, rendering, 
    Next.js, deployment, documentation, or cross-boundary behavior and select 
    its required checks.
  examples:
  - An invoice-issuance change requires domain, ShovelerDB reopen, API, 
    concurrency, and PDF checks; a spacing-only change requires focused UI and 
    visual evidence.
  title: Classify the changed responsibility
- description: For critical financial, scheduling, persistence, security, and 
    escaping behavior, record a failing test against the pre-change boundary 
    before production edits.
  examples:
  - Demonstrate that a retry allocates two invoice numbers before implementing 
    idempotency.
  title: Prove the critical test went red
- description: Run Zig formatting and compilation, TypeScript formatting, 
    ESLint, strict type checks, and focused unit or component tests before 
    slower suites.
  examples:
  - Stop before Playwright and PDF rendering when a Zig domain test is red.
  title: Run fast static gates
- description: Exercise the real ShovelerDB repository, HTTP contract, browser 
    workflow, or LuaLaTeX boundary implicated by the change.
  examples:
  - Checkpoint, close, reopen, and query the issued invoice through the public 
    API.
  title: Run changed-boundary integration gates
- description: Enforce 90% coverage for the Zig domain layer and run applicable 
    PDF visual, accessibility, dependency, license, and production-build checks.
  examples:
  - Include long-content and domestic-bank-absence PDF fixtures after changing 
    the template.
  title: Apply coverage and regression gates
- description: Report commands, results, focused omissions, and unrelated 
    pre-existing failures without representing partial validation as complete.
  examples:
  - State that PDF regression was not applicable to a documentation-only change 
    and why.
  title: Record the validation result
