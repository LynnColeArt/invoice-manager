anti_patterns:
- bad_example: README says bank details are always shown after domestic policy 
    begins hiding them.
  description: Documentation promises behavior that fixtures or APIs no longer 
    provide.
  good_example: README, API contract, and domestic/EU fixtures change together.
  name: Stale behavior prose
- bad_example: Copy a production invoice into tests.
  description: Public documentation must not disclose real clients, invoices, 
    addresses, or bank details.
  good_example: Construct an obviously synthetic fixture covering the same 
    layout.
  name: Real business data in examples
- bad_example: Revenue increased to $10,000.
  description: The word revenue alone can conceal whether a value is invoiced, 
    collected, outstanding, or forecast.
  good_example: USD collected revenue by payment date increased to $10,000.
  name: Ambiguous financial language
id: documentation-policy-style-guide
patterns:
- description: Link a business-readable example to its requirement and 
    executable acceptance evidence.
  good_example: FR-REM-002 -> EU LLC invoice example -> PDF remittance presence 
    test
  name: Requirement-to-example trace
- description: Record context, options, decision, consequences, and supersession
    for material architecture or governance choices.
  good_example: 'ADR: Zig owns sessions; Next.js remains a presentation client.'
  name: Decision record
- description: Make synthetic values obvious and impossible to mistake for 
    production credentials.
  good_example: 'IBAN: GB00 TEST 0000 0000 0000 00'
  name: Safe fixture
principles:
- Document observable behavior and operational decisions in the same change that
  alters them.
- Use Billing Identity, Client, Project, Billing Period, Invoice Snapshot, 
  Payment, Remittance Block, and Due Project consistently.
- Keep one named authority for each rule and link to it instead of copying 
  divergent prose.
- Use synthetic identities, addresses, bank values, and invoices in all public 
  examples and fixtures.
- Explain recovery, migration, backup, and security behavior as carefully as the
  happy path.
quality_test: Can a new contributor find the authority, example, test, 
  migration, and user consequence for a behavior change without seeing private 
  business data?
references:
- docs/planning-brief.md
schema_version: '1.0'
